name: Build Standalone Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: secure-folder-windows.exe
            build_cmd: scripts/build_windows.bat
            platform: windows
          - os: ubuntu-22.04
            artifact_name: secure-folder-linux
            build_cmd: bash scripts/build_linux.sh
            platform: linux
          - os: macos-latest
            artifact_name: secure-folder-macos
            build_cmd: bash scripts/build_macos.sh
            platform: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run test suite
        run: |
          python -m pytest -v

      - name: Build standalone executable
        run: |
          ${{ matrix.build_cmd }}

      - name: Calculate SHA-256 checksum
        shell: bash
        run: |
          cd dist
          sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          cat ${{ matrix.artifact_name }}.sha256

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.sha256

  release:
    name: Publish GitHub Release
    needs: build
    # Runs on git tags (v*), manual 'workflow_dispatch', or normal push to main
    if: (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Display downloaded files
        run: ls -R release_artifacts

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('SecureFolder {0}', github.ref_name) || 'SecureFolder (Latest Build)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: release_artifacts/**/*
          generate_release_notes: true
